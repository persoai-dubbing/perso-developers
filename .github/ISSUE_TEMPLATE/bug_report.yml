name: Bug Report
description: Report a reproducible bug in the Perso Developer Portal or API integration
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the sections below so we can reproduce and fix it quickly.

        > Do **not** include API keys, access tokens, or other secrets in this issue. Redact them from logs and screenshots before posting.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of what the bug is.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Numbered steps work best.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, status codes, and stack traces if available.
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Affected endpoint or page
      description: e.g. `POST /video-translator/api/v1/projects` or `/api-keys`
      placeholder: GET /video-translator/api/v1/...

  - type: input
    id: request-id
    attributes:
      label: Request ID (if applicable)
      description: From the portal's request log or response headers. Helps us trace the failing call.
      placeholder: req_xxxxxxxxxxxxxxxx

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Browser, OS, SDK version, language/runtime, screenshots, related issues, anything else relevant.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed all API keys, tokens, and secrets from logs and screenshots.
          required: true
