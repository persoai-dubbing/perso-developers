name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you're trying to solve before jumping to a specific solution — it helps us evaluate the request and consider alternatives.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What problem are you trying to solve? What's the user story?
      placeholder: As a developer integrating the Dubbing API, I need ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Concrete API shapes, UI sketches, or example code are very helpful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Developer Portal (UI)
        - API (Video Translator)
        - API (Dubbing)
        - API (Lip Sync)
        - API (Audio Separation)
        - API (STT)
        - API (Editing)
        - API (File / Upload)
        - API (Space)
        - API (Language)
        - Documentation
        - SDK / examples
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, screenshots, related issues, anything else relevant.

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
